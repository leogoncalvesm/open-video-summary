[project]
name = "open-video-summary"
version = "0.1.0"
description = ""
authors = [
    {name = "Leo", email = "leonardogmoraes2000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy<2.0",
    "pandas==2.2.3",
    "pandas-stubs==2.2.3.241126",
    "tf-keras==2.17.0",
    "tensorflow==2.17.1",
    "types-tensorflow==2.18.0.20241227",
    "opencv-python==4.10.0.84",
    "sentence-transformers==3.3.1",
    "ffmpeg==1.4",
    "moviepy==2.1.2",
    "dacite==1.9.1",
    "imageio==2.37.0",
    "whisper-timestamped==1.15.8",
    "SpeechRecognition==3.10.4",
    "openai (==3.3.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "faker==37.0.2",
    "matplotlib (>=3.10.3,<4.0.0)",
]

[tool.poetry.group.dev.dependencies]
gdown = "5.2.0"
deepeval = "4.1.8"
ipykernel = "6.29.5"
kagglehub = "^1.0.2"
black = {extras = ["jupyter"], version = "^26.5.1"}
bert-score = "^0.3.13"
rouge-score = "^0.1.2"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "open_video_summary" }
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["moviepy.*", "cv2", "dacite", "tensorflow", "sentence_transformers", "pandas", "whisper_timestamped"]
disallow_untyped_defs = true
ignore_missing_imports = true
